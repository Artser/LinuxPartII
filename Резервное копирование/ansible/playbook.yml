- name: Configure backup infrastructure
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

- name: Configure backup server
  hosts: backup_servers
  become: yes
  roles:
    - backup_server

- name: Configure client for backups
  hosts: clients
  become: yes
  roles:
    - client
